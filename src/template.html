<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1200, initial-scale=1">
    <style>{{STYLES}}</style>
  </head>
  <body>
    <main class="cover" style="{{THEME_VARS}}" data-theme="{{THEME_NAME}}">
      <section class="top-section">
        <header class="category-header">
          <div class="category-badge">{{LARGE_CATEGORY}}</div>
          <div class="category-line" aria-hidden="true"><span></span></div>
          <div class="small-category">{{SMALL_CATEGORY}}</div>
        </header>
        <h1 class="cover-title" style="--title-size: {{TITLE_SIZE}}px">{{COVER_TITLE}}</h1>
      </section>
      <section class="bottom-section">
        <div class="content-row">
          <div class="icon-wrap" aria-hidden="true">{{ICON_SVG}}</div>
          <div class="vertical-divider" aria-hidden="true"></div>
          <div class="subtitle" style="--subtitle-size: {{SUBTITLE_SIZE}}px">{{SUBTITLE}}</div>
        </div>
        <div class="brand">자각 : 기록의 온도</div>
      </section>
    </main>
  </body>
</html>
